<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .fg     { fill: #1f2328; }
    .muted  { fill: #59636e; }
    .box    { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 6 4; }
    .quic   { stroke: #0969da; stroke-width: 3; fill: none; }
    .eth    { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .ethbox { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .h3box  { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .title  { font-size: 17px; font-weight: 600; }
    .label  { font-size: 14px; }
    .small  { font-size: 12px; }
    .addr   { font-size: 11px; }
    .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .fg     { fill: #e6edf3; }
      .muted  { fill: #9198a1; }
      .box    { fill: #151b23; stroke: #3d444d; }
      .quic   { stroke: #4493f8; }
      .eth    { stroke: #3fb950; }
      .ethbox { fill: #0f2a1a; stroke: #3fb950; }
      .h3box  { fill: #0c2d4b; stroke: #4493f8; }
    }
  </style>

  <!-- ===== Clients ===== -->
  <g>
    <rect class="box" x="20" y="40" width="270" height="120" rx="10"/>
    <text class="fg title" x="35" y="66">Client 1</text>
    <rect class="ethbox" x="35" y="80" width="130" height="62" rx="6"/>
    <text class="fg label mono" x="100" y="99" text-anchor="middle">tap0</text>
    <text class="muted addr mono" x="100" y="116" text-anchor="middle">198.51.100.10</text>
    <text class="muted addr mono" x="100" y="132" text-anchor="middle">2001:db8:2::10</text>
    <rect class="h3box" x="185" y="86" width="95" height="50" rx="6"/>
    <text class="fg label" x="232" y="108" text-anchor="middle">connect-eth</text>
    <text class="muted small mono" x="232" y="126" text-anchor="middle">Dial()</text>
    <line class="eth" x1="165" y1="111" x2="185" y2="111"/>
  </g>
  <g>
    <rect class="box" x="20" y="185" width="270" height="120" rx="10"/>
    <text class="fg title" x="35" y="211">Client 2</text>
    <rect class="ethbox" x="35" y="225" width="130" height="62" rx="6"/>
    <text class="fg label mono" x="100" y="244" text-anchor="middle">tap0</text>
    <text class="muted addr mono" x="100" y="261" text-anchor="middle">198.51.100.11</text>
    <text class="muted addr mono" x="100" y="277" text-anchor="middle">2001:db8:2::11</text>
    <rect class="h3box" x="185" y="231" width="95" height="50" rx="6"/>
    <text class="fg label" x="232" y="253" text-anchor="middle">connect-eth</text>
    <text class="muted small mono" x="232" y="271" text-anchor="middle">Dial()</text>
    <line class="eth" x1="165" y1="256" x2="185" y2="256"/>
  </g>
  <text class="muted title" x="155" y="327" text-anchor="middle">⋮</text>
  <g>
    <rect class="box dashed" x="20" y="340" width="270" height="120" rx="10"/>
    <text class="fg title" x="35" y="366">Client N</text>
    <rect class="ethbox" x="35" y="380" width="130" height="62" rx="6"/>
    <text class="fg label mono" x="100" y="399" text-anchor="middle">tap0</text>
    <text class="muted addr mono" x="100" y="416" text-anchor="middle">198.51.100.N</text>
    <text class="muted addr mono" x="100" y="432" text-anchor="middle">2001:db8:2::N</text>
    <rect class="h3box" x="185" y="386" width="95" height="50" rx="6"/>
    <text class="fg label" x="232" y="408" text-anchor="middle">connect-eth</text>
    <text class="muted small mono" x="232" y="426" text-anchor="middle">Dial()</text>
    <line class="eth" x1="165" y1="411" x2="185" y2="411"/>
  </g>

  <!-- ===== QUIC tunnels ===== -->
  <line class="quic" x1="280" y1="111" x2="485" y2="111"/>
  <line class="quic" x1="280" y1="256" x2="485" y2="256"/>
  <line class="quic dashed" x1="280" y1="411" x2="485" y2="411"/>
  <text class="fg label" x="382" y="100" text-anchor="middle">QUIC · HTTP/3</text>
  <text class="muted small" x="382" y="131" text-anchor="middle">Extended CONNECT</text>
  <text class="muted small mono" x="382" y="147" text-anchor="middle">connect-ethernet</text>
  <text class="fg label" x="382" y="245" text-anchor="middle">QUIC · HTTP/3</text>
  <text class="muted small" x="382" y="276" text-anchor="middle">Ethernet frames in</text>
  <text class="muted small" x="382" y="292" text-anchor="middle">HTTP Datagrams</text>
  <text class="fg label" x="382" y="400" text-anchor="middle">QUIC · HTTP/3</text>

  <!-- ===== Proxy ===== -->
  <rect class="box" x="470" y="20" width="360" height="455" rx="10"/>
  <text class="fg title" x="650" y="46" text-anchor="middle">Proxy</text>

  <rect class="h3box" x="485" y="60" width="110" height="400" rx="6"/>
  <text class="fg label" x="540" y="250" text-anchor="middle">connect-eth</text>
  <text class="muted small mono" x="540" y="274" text-anchor="middle">ParseRequest()</text>
  <text class="muted small mono" x="540" y="290" text-anchor="middle">Proxy()</text>

  <rect class="ethbox" x="615" y="91" width="70" height="40" rx="6"/>
  <text class="fg label mono" x="650" y="116" text-anchor="middle">tap1</text>
  <rect class="ethbox" x="615" y="236" width="70" height="40" rx="6"/>
  <text class="fg label mono" x="650" y="261" text-anchor="middle">tap2</text>
  <rect class="ethbox dashed" x="615" y="391" width="70" height="40" rx="6"/>
  <text class="fg label mono" x="650" y="416" text-anchor="middle">tapN</text>
  <line class="eth" x1="595" y1="111" x2="615" y2="111"/>
  <line class="eth" x1="595" y1="256" x2="615" y2="256"/>
  <line class="eth" x1="595" y1="411" x2="615" y2="411"/>
  <text class="muted small" x="650" y="152" text-anchor="middle">one TAP</text>
  <text class="muted small" x="650" y="167" text-anchor="middle">per client</text>

  <rect class="ethbox" x="705" y="60" width="40" height="400" rx="6"/>
  <text class="fg label mono" x="725" y="260" text-anchor="middle" transform="rotate(-90 725 260)">br0 (Linux bridge)</text>
  <line class="eth" x1="685" y1="111" x2="705" y2="111"/>
  <line class="eth" x1="685" y1="256" x2="705" y2="256"/>
  <line class="eth" x1="685" y1="411" x2="705" y2="411"/>

  <rect class="ethbox" x="765" y="236" width="80" height="40" rx="6"/>
  <text class="fg label mono" x="805" y="261" text-anchor="middle">eth1</text>
  <line class="eth" x1="745" y1="256" x2="765" y2="256"/>

  <!-- ===== Target Ethernet segment ===== -->
  <text class="fg title" x="935" y="40" text-anchor="middle">Ethernet LAN</text>
  <text class="muted addr mono" x="935" y="58" text-anchor="middle">198.51.100.0/24</text>
  <text class="muted addr mono" x="935" y="73" text-anchor="middle">2001:db8:2::/64</text>
  <line class="eth" x1="875" y1="95" x2="875" y2="440" stroke-width="4"/>
  <line class="eth" x1="845" y1="256" x2="875" y2="256"/>

  <rect class="box" x="890" y="140" width="105" height="70" rx="8"/>
  <text class="fg label" x="942" y="164" text-anchor="middle">Server</text>
  <text class="muted addr mono" x="942" y="182" text-anchor="middle">198.51.100.3</text>
  <text class="muted addr mono" x="942" y="198" text-anchor="middle">2001:db8:2::3</text>
  <line class="eth" x1="875" y1="175" x2="890" y2="175"/>

  <rect class="box dashed" x="890" y="320" width="105" height="60" rx="8"/>
  <text class="fg label" x="942" y="346" text-anchor="middle">Other</text>
  <text class="fg label" x="942" y="364" text-anchor="middle">hosts</text>
  <line class="eth" x1="875" y1="350" x2="890" y2="350"/>

  <!-- ===== Legend ===== -->
  <line class="quic" x1="20" y1="500" x2="60" y2="500"/>
  <text class="fg small" x="68" y="504">QUIC connection (one per client)</text>
  <line class="eth" x1="300" y1="500" x2="340" y2="500"/>
  <text class="fg small" x="348" y="504">Ethernet frames — clients get addresses on the LAN, and reach each other through br0</text>
</svg>
